<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 🍽️</title>
  <style>
    :root {
      --cream: #fff8ec;
      --card: #ffffff;
      --orange: #ff8a3d;
      --orange-dark: #e8691c;
      --orange-soft: #ffe6d3;
      --text: #4a3426;
      --muted: #8a7363;
      --line: #f3dcc6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header { text-align: center; margin-bottom: 20px; }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      color: var(--orange-dark);
    }

    .subtitle { margin: 6px 0 0; color: var(--muted); }

    .panel {
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(232, 105, 28, 0.10);
      margin-bottom: 16px;
    }

    fieldset {
      border: 0;
      margin: 0 0 16px;
      padding: 0;
      min-width: 0;
    }

    fieldset:last-of-type { margin-bottom: 0; }

    legend {
      font-weight: 700;
      margin-bottom: 8px;
      padding: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 라디오 버튼은 숨기고, 라벨을 둥근 버튼처럼 보이게 합니다 */
    .chip { position: relative; }

    .chip input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .chip span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 8px 16px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--cream);
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .chip span:hover { border-color: var(--orange); }

    .chip input:checked + span {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      font-weight: 700;
    }

    .chip input:checked + span::before { content: "✓"; }

    .chip input:focus-visible + span {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      font: inherit;
      min-height: 52px;
      border-radius: 999px;
      border: 0;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.1s, background 0.15s;
    }

    button:active { transform: scale(0.97); }

    button:focus-visible {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    .btn-main {
      flex: 1 1 220px;
      background: var(--orange);
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 var(--orange-dark);
    }

    .btn-main:hover { background: var(--orange-dark); }

    .btn-sub {
      flex: 1 1 120px;
      background: var(--card);
      color: var(--orange-dark);
      border: 2px solid var(--orange);
    }

    .btn-sub:hover { background: var(--orange-soft); }

    .result {
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .result .emoji {
      font-size: 4.5rem;
      line-height: 1.1;
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .result .name {
      margin: 0;
      font-size: 1.6rem;
      color: var(--text);
      word-break: keep-all;
    }

    .result .desc {
      margin: 0;
      color: var(--muted);
      word-break: keep-all;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .tag {
      background: var(--orange-soft);
      color: var(--orange-dark);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      word-break: keep-all;
    }

    .message .big { display: block; font-size: 3rem; margin-bottom: 6px; }

    .note {
      margin: 10px 0 0;
      background: var(--orange-soft);
      color: var(--orange-dark);
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 700;
    }

    #retryBtn { margin-top: 14px; flex: 0 1 auto; }

    .disclaimer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>오늘 뭐 먹지? 🍽️</h1>
      <p class="subtitle">조건을 고르면 점심 메뉴를 골라 드려요!</p>
    </header>

    <form class="panel" id="filters" onsubmit="return false;">
      <fieldset>
        <legend>🍱 음식 종류</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="category" value="전체" checked><span>전체</span></label>
          <label class="chip"><input type="radio" name="category" value="한식"><span>한식</span></label>
          <label class="chip"><input type="radio" name="category" value="중식"><span>중식</span></label>
          <label class="chip"><input type="radio" name="category" value="일식"><span>일식</span></label>
          <label class="chip"><input type="radio" name="category" value="양식"><span>양식</span></label>
          <label class="chip"><input type="radio" name="category" value="분식"><span>분식</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>💰 최대 예산</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="budget" value="0" checked><span>제한 없음</span></label>
          <label class="chip"><input type="radio" name="budget" value="8000"><span>8,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="10000"><span>10,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="15000"><span>15,000원</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>🌶️ 매운 정도</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="spicy" value="any" checked><span>상관없음</span></label>
          <label class="chip"><input type="radio" name="spicy" value="0"><span>안 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="1"><span>살짝 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="2"><span>매운 음식</span></label>
        </div>
      </fieldset>
    </form>

    <div class="actions">
      <button type="button" class="btn-main" id="recommendBtn">점심 메뉴 추천받기</button>
      <button type="button" class="btn-sub" id="resetBtn">조건 초기화</button>
    </div>

    <section class="panel result" id="result" aria-live="polite">
      <p class="message"><span class="big">🤔</span>조건을 고르고 추천 버튼을 눌러 보세요!</p>
    </section>

    <p class="disclaimer">※ 가격은 실습용 예시 금액이며 실제 식당 가격과 다를 수 있어요.</p>
  </div>

  <script>
    // =====================================================================
    // 🍽️ 메뉴 목록 (여기서 메뉴를 추가하거나 수정하세요!)
    // ---------------------------------------------------------------------
    // 메뉴 하나는 { } 한 묶음이에요. 아래 형식을 그대로 복사해서 추가하면 됩니다.
    //   name     : 메뉴 이름
    //   category : 음식 종류 → "한식", "중식", "일식", "양식", "분식" 중 하나
    //   emoji    : 음식 이모지
    //   desc     : 짧은 설명
    //   price    : 예상 가격 (숫자만, 쉼표 없이! 예: 9000)
    //   spicy    : 매운 정도 → 0 = 안 매움, 1 = 살짝 매움, 2 = 매움
    // 묶음과 묶음 사이에는 쉼표(,)를 꼭 넣어 주세요.
    // =====================================================================
    const MENUS = [
      // ----- 한식 메뉴 -----
      { name: "김치찌개", category: "한식", emoji: "🍲", desc: "잘 익은 김치와 돼지고기가 들어간 든든한 찌개", price: 9000, spicy: 1 },
      { name: "비빔밥", category: "한식", emoji: "🥗", desc: "여러 가지 나물과 달걀을 올려 쓱쓱 비벼 먹는 밥", price: 9500, spicy: 0 },
      { name: "제육볶음", category: "한식", emoji: "🍖", desc: "매콤달콤한 양념에 볶은 돼지고기와 밥 한 공기", price: 10000, spicy: 2 },
      { name: "된장찌개", category: "한식", emoji: "🥘", desc: "구수한 된장에 두부와 애호박이 듬뿍", price: 8000, spicy: 0 },
      { name: "순두부찌개", category: "한식", emoji: "🌋", desc: "보들보들한 순두부를 얼큰한 국물에 끓인 찌개", price: 9000, spicy: 2 },
      { name: "갈비탕", category: "한식", emoji: "🍖", desc: "푹 고아 낸 맑은 국물과 부드러운 갈비", price: 14000, spicy: 0 },

      // ----- 중식 메뉴 -----
      { name: "짜장면", category: "중식", emoji: "🍜", desc: "달콤 짭짤한 춘장 소스를 듬뿍 올린 면", price: 7000, spicy: 0 },
      { name: "짬뽕", category: "중식", emoji: "🌶️", desc: "해산물과 채소가 가득한 얼큰한 빨간 국물", price: 8500, spicy: 2 },
      { name: "볶음밥", category: "중식", emoji: "🍳", desc: "불맛 나게 볶은 밥에 달걀 프라이 하나", price: 8000, spicy: 0 },
      { name: "마파두부밥", category: "중식", emoji: "🍛", desc: "두부와 다진 고기를 살짝 매콤하게 볶아 밥에 얹은 요리", price: 9000, spicy: 1 },
      { name: "탕수육 정식", category: "중식", emoji: "🍤", desc: "바삭한 탕수육과 짜장 소스 밥이 함께 나오는 세트", price: 13000, spicy: 0 },
      { name: "마라탕", category: "중식", emoji: "🔥", desc: "얼얼하고 매운 국물에 원하는 재료를 골라 넣는 탕", price: 12000, spicy: 2 },

      // ----- 일식 메뉴 -----
      { name: "돈카츠", category: "일식", emoji: "🍱", desc: "겉은 바삭, 속은 촉촉한 두툼한 돼지고기 튀김", price: 10000, spicy: 0 },
      { name: "규동", category: "일식", emoji: "🍚", desc: "달큰하게 졸인 소고기를 밥 위에 올린 덮밥", price: 8500, spicy: 0 },
      { name: "돈코츠 라멘", category: "일식", emoji: "🍜", desc: "진한 돼지뼈 국물에 차슈를 올린 라멘", price: 10000, spicy: 0 },
      { name: "카레라이스", category: "일식", emoji: "🍛", desc: "채소를 푹 끓인 살짝 매콤한 일본식 카레", price: 8000, spicy: 1 },
      { name: "매운 미소라멘", category: "일식", emoji: "🌶️", desc: "된장 국물에 매운 양념을 더한 얼큰한 라멘", price: 11000, spicy: 2 },
      { name: "모둠 초밥", category: "일식", emoji: "🍣", desc: "신선한 생선을 올린 초밥 12피스 세트", price: 16000, spicy: 0 },

      // ----- 양식 메뉴 -----
      { name: "수제 햄버거 세트", category: "양식", emoji: "🍔", desc: "두툼한 패티 버거에 감자튀김과 음료", price: 9000, spicy: 0 },
      { name: "매운 치킨버거", category: "양식", emoji: "🍗", desc: "살짝 매콤한 소스를 바른 바삭 치킨버거", price: 8000, spicy: 1 },
      { name: "토마토 파스타", category: "양식", emoji: "🍝", desc: "새콤달콤한 토마토 소스 스파게티", price: 12000, spicy: 0 },
      { name: "아라비아따", category: "양식", emoji: "🌶️", desc: "페페론치노를 넣어 화끈하게 매운 토마토 파스타", price: 12500, spicy: 2 },
      { name: "버섯 크림 리조또", category: "양식", emoji: "🍄", desc: "고소한 크림 소스에 버섯을 넣은 부드러운 리조또", price: 14000, spicy: 0 },
      { name: "스테이크 덮밥", category: "양식", emoji: "🥩", desc: "구운 소고기 스테이크를 밥 위에 듬뿍 올린 덮밥", price: 16000, spicy: 0 },

      // ----- 분식 메뉴 -----
      { name: "떡볶이", category: "분식", emoji: "🍢", desc: "쫄깃한 떡과 어묵을 매콤한 고추장 소스에", price: 5000, spicy: 2 },
      { name: "김밥", category: "분식", emoji: "🍙", desc: "단무지, 시금치, 달걀이 들어간 기본 김밥 한 줄", price: 3500, spicy: 0 },
      { name: "라면", category: "분식", emoji: "🍜", desc: "달걀 하나 톡 넣은 살짝 매콤한 라면", price: 4500, spicy: 1 },
      { name: "쫄면", category: "분식", emoji: "🥢", desc: "새콤하고 매운 양념에 비벼 먹는 쫄깃한 면", price: 6500, spicy: 2 },
      { name: "모둠 튀김", category: "분식", emoji: "🍤", desc: "오징어, 고구마, 김말이를 바삭하게 튀긴 세트", price: 5000, spicy: 0 },
      { name: "돈까스 오므라이스", category: "분식", emoji: "🍳", desc: "달걀로 감싼 볶음밥에 돈까스까지 올린 푸짐한 한 접시", price: 8500, spicy: 0 }
    ];
    // ===================== 메뉴 목록 끝 =====================

    // 매운 정도 숫자를 화면에 보여 줄 글자로 바꿔 줍니다
    const SPICY_LABELS = ["😊 안 매움", "🌶️ 살짝 매움", "🌶️🌶️ 매움"];

    const form = document.getElementById("filters");
    const resultBox = document.getElementById("result");
    const recommendBtn = document.getElementById("recommendBtn");
    const resetBtn = document.getElementById("resetBtn");

    let lastMenu = null; // 직전에 추천한 메뉴

    // 현재 선택된 조건 읽기
    function getConditions() {
      return {
        category: form.category.value,
        budget: Number(form.budget.value),   // 0이면 제한 없음
        spicy: form.spicy.value              // "any" 또는 "0", "1", "2"
      };
    }

    // 모든 조건을 만족하는 메뉴만 골라내기
    function findMatches(cond) {
      return MENUS.filter(menu =>
        (cond.category === "전체" || menu.category === cond.category) &&
        (cond.budget === 0 || menu.price <= cond.budget) &&
        (cond.spicy === "any" || menu.spicy === Number(cond.spicy))
      );
    }

    function showMessage(emoji, text) {
      resultBox.innerHTML = "";
      const p = document.createElement("p");
      p.className = "message";
      const big = document.createElement("span");
      big.className = "big";
      big.textContent = emoji;
      p.append(big, text);
      resultBox.append(p);
    }

    function showMenu(menu, onlyOne) {
      resultBox.innerHTML = "";

      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = menu.emoji;

      const name = document.createElement("h2");
      name.className = "name";
      name.textContent = menu.name;

      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = menu.desc;

      const tags = document.createElement("div");
      tags.className = "tags";
      [menu.category, "💰 약 " + menu.price.toLocaleString("ko-KR") + "원", SPICY_LABELS[menu.spicy]]
        .forEach(text => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = text;
          tags.append(tag);
        });

      resultBox.append(emoji, name, desc, tags);

      if (onlyOne) {
        const note = document.createElement("p");
        note.className = "note";
        note.textContent = "조건에 맞는 메뉴가 하나예요.";
        resultBox.append(note);
      }

      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "btn-sub";
      retry.id = "retryBtn";
      retry.textContent = "🔄 다시 추천";
      retry.addEventListener("click", () => recommend(true));
      resultBox.append(retry);
    }

    // 추천하기 (excludeLast가 true면 직전 메뉴는 빼고 고릅니다)
    function recommend(excludeLast) {
      const matches = findMatches(getConditions());

      if (matches.length === 0) {
        lastMenu = null;
        showMessage("😢", "조건에 맞는 메뉴가 없어요. 예산이나 다른 조건을 바꿔보세요.");
        return;
      }

      if (matches.length === 1) {
        lastMenu = matches[0];
        showMenu(matches[0], true);
        return;
      }

      const pool = excludeLast && lastMenu
        ? matches.filter(menu => menu !== lastMenu)
        : matches;
      const picked = pool[Math.floor(Math.random() * pool.length)];
      lastMenu = picked;
      showMenu(picked, false);
    }

    recommendBtn.addEventListener("click", () => recommend(false));

    // 조건을 바꾸면 이전 결과를 지우고 안내 문구를 보여 줍니다
    form.addEventListener("change", () => {
      lastMenu = null;
      showMessage("🔁", "조건이 바뀌었어요. 다시 추천받아 보세요.");
    });

    // 조건 초기화: 기본 선택으로 되돌리기
    resetBtn.addEventListener("click", () => {
      form.reset();
      lastMenu = null;
      showMessage("🤔", "조건을 고르고 추천 버튼을 눌러 보세요!");
    });
  </script>
</body>
</html>
